<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>외주 통합관리 — 업무 흐름 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#F2F2F4; --panel:#FFFFFF; --panel-2:#F7F7F9; --line:#E2E2E8; --line-soft:#EDEDF2;
  --ink:#1A1A22; --ink-2:#4A4A57; --ink-3:#85858F;
  --accent:#5A5F7D; --accent-ink:#3F4461; --accent-wash:#ECEDF4; --accent-solid:#5A5F7D;
  --ok:#15803D; --ok-wash:#E4F2E8; --bad:#B3261E; --bad-wash:#F9E7E6;
  --warn:#A65A06; --warn-wash:#FAEEE0; --idle:#5A6775; --idle-wash:#E8ECF0;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sh:0 1px 2px rgba(15,22,32,.06),0 18px 40px -24px rgba(15,22,32,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C1218; --panel:#151D25; --panel-2:#1C262F; --line:#2A3742; --line-soft:#222D37;
  --ink:#E8EEF3; --ink-2:#B4C1CC; --ink-3:#7F8F9D;
  --accent:#3FB3C4; --accent-ink:#8BD7E1; --accent-wash:#123138; --accent-solid:#5A5F7D;
  --ok:#5FC183; --ok-wash:#14301F; --bad:#F0908A; --bad-wash:#371A1A;
  --warn:#E0A055; --warn-wash:#342313; --idle:#93A2AF; --idle-wash:#222D37;
  --sh:0 1px 2px rgba(0,0,0,.5),0 18px 40px -24px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0C1218; --panel:#151D25; --panel-2:#1C262F; --line:#2A3742; --line-soft:#222D37;
  --ink:#E8EEF3; --ink-2:#B4C1CC; --ink-3:#7F8F9D;
  --accent:#3FB3C4; --accent-ink:#8BD7E1; --accent-wash:#123138; --accent-solid:#5A5F7D;
  --ok:#5FC183; --ok-wash:#14301F; --bad:#F0908A; --bad-wash:#371A1A;
  --warn:#E0A055; --warn-wash:#342313; --idle:#93A2AF; --idle-wash:#222D37;
  --sh:0 1px 2px rgba(0,0,0,.5),0 18px 40px -24px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== app shell ===== */
.app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:900px){.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
.brand{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand-t{font-size:16px;font-weight:600;margin:5px 0 4px}
.brand-s{font-size:12.5px;color:var(--ink-3);margin-bottom:20px;line-height:1.5}
.grp{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px;padding-left:8px}
.navi{display:flex;flex-direction:column;gap:1px}
.navi button{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:6px;text-align:left;font-size:13.5px;color:var(--ink-2);width:100%;line-height:1.4}
.navi button:hover{background:var(--panel-2);color:var(--ink)}
.navi button[aria-current="true"]{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.navi .sid{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);min-width:46px;font-weight:500}
.navi button[aria-current="true"] .sid{color:var(--accent-ink)}

/* ===== stage ===== */
.stage{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.crumb{font-family:var(--mono);font-size:11px;color:var(--accent-ink);background:var(--accent-wash);padding:3px 8px;border-radius:4px;font-weight:600}
.crumb-t{font-size:15px;font-weight:600}
.crumb-d{font-size:12.5px;color:var(--ink-3);margin-left:auto;max-width:46ch;text-align:right;line-height:1.45}
.canvas{flex:1;display:grid;place-items:start center;padding:34px 26px 70px;overflow-x:auto}

/* ===== device frames ===== */
.phone{width:330px;border:9px solid #1A222B;border-radius:34px;background:var(--panel);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;height:700px}
.desktop{width:min(980px,100%);border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;min-height:560px}
.dbar{display:flex;gap:6px;align-items:center;padding:9px 14px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.durl{margin-left:10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);background:var(--panel);padding:3px 10px;border-radius:5px;border:1px solid var(--line)}
.status{display:flex;justify-content:space-between;padding:7px 16px 3px;font-family:var(--mono);font-size:10px;color:var(--ink-3)}

/* ===== in-app chrome ===== */
.hdr{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--panel)}
.hdr .back{font-size:17px;color:var(--ink-3);line-height:1;padding:2px 4px}
.hdr h3{margin:0;font-size:15px;font-weight:600;flex:1;line-height:1.3}
.hdr .sub{font-size:11.5px;color:var(--ink-3);font-weight:400;display:block;margin-top:1px}
.body{flex:1;overflow-y:auto;padding:14px 15px 20px;display:flex;flex-direction:column;gap:11px;background:var(--ground)}
.desktop .body{padding:20px 24px 28px;gap:15px}
.foot{padding:11px 15px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:8px}

/* ===== ui atoms ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 14px}
.card.tap{cursor:pointer;transition:border-color .12s,transform .08s}
.card.tap:hover{border-color:var(--accent)}
.card.tap:active{transform:scale(.994)}
.card.sel{border-color:var(--accent);background:var(--accent-wash)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.t1{font-size:14px;font-weight:600;line-height:1.4}
.t2{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:2px}
.t3{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{padding:11px 14px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink-2)}
.btn.pri{background:var(--accent-solid);color:#fff;border-color:var(--accent-solid)}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:12.5px;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;background:var(--idle-wash);color:var(--idle);white-space:nowrap;letter-spacing:.03em}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)}
.pill.warn{background:var(--warn-wash);color:var(--warn)} .pill.acc{background:var(--accent-wash);color:var(--accent-ink)}
.sec{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:4px}
.field{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.field label{display:block;font-size:11px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.field .val{font-size:14px;font-weight:500}
.field .ph{font-size:14px;color:var(--ink-3)}
.bar{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-solid);border-radius:3px}
.note{background:var(--accent-wash);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.note.warn{background:var(--warn-wash);border-left-color:var(--warn)}
.note.bad{background:var(--bad-wash);border-left-color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.kv:last-child{border:0}
.kv span:first-child{color:var(--ink-3)}
.kv span:last-child{font-weight:500;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line-soft)}
thead th{background:var(--panel-2);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
tbody tr:last-child td{border-bottom:0}
.tbl{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.tbl.scroll{overflow-x:auto}
.tbl.scroll table{min-width:1120px}
.dd{position:relative;border:1px solid var(--accent);border-radius:6px;padding:5px 24px 5px 9px;background:var(--accent-wash);color:var(--accent-ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.dd::after{content:"▾";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;opacity:.7}
.dd.plain{border-color:var(--line);background:var(--panel);color:var(--ink)}
.ddlist{position:absolute;left:0;top:calc(100% + 4px);z-index:5;background:var(--panel);border:1px solid var(--accent);border-radius:7px;box-shadow:var(--sh);min-width:210px;overflow:hidden}
.ddlist div{padding:7px 11px;font-size:12.5px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.ddlist div:last-child{border:0}
.ddlist div.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.ddlist div.off{color:var(--ink-3);text-decoration:line-through}
.form{border:1px solid var(--ink);background:#fff;color:#111;padding:0;font-size:11px}
.form table{border-collapse:collapse;width:100%}
.form th,.form td{border:1px solid #555;padding:4px 6px;text-align:center;font-size:10.5px;color:#111}
.form .hd{font-weight:700;font-size:16px;letter-spacing:.4em;padding:9px 0;border:0}
.form .yl{background:#FFFF99}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 4px}
.tabs button{padding:9px 14px;font-size:13.5px;color:var(--ink-3);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}
@media(max-width:760px){.split{grid-template-columns:1fr}}

/* camera */
.cam{position:relative;border-radius:11px;overflow:hidden;background:linear-gradient(150deg,#243039,#131a21);aspect-ratio:3/4;display:grid;place-items:center}
.cam .frame{position:absolute;inset:34px 22px;border:2px dashed rgba(255,255,255,.42);border-radius:7px}
.cam .corner{position:absolute;width:22px;height:22px;border:2.5px solid var(--accent);border-radius:2px}
.cam .c1{top:26px;left:14px;border-right:0;border-bottom:0}
.cam .c2{top:26px;right:14px;border-left:0;border-bottom:0}
.cam .c3{bottom:26px;left:14px;border-right:0;border-top:0}
.cam .c4{bottom:26px;right:14px;border-left:0;border-top:0}
.cam .subj{color:rgba(255,255,255,.5);font-size:12px;text-align:center;font-family:var(--mono);letter-spacing:.05em}
.cam .warnbar{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(166,90,6,.94);color:#fff;font-size:11.5px;padding:7px 10px;border-radius:6px;text-align:center;font-weight:500}
.cam .okbar{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(21,128,61,.94);color:#fff;font-size:11.5px;padding:7px 10px;border-radius:6px;text-align:center;font-weight:500}
.shutter{width:58px;height:58px;border-radius:50%;border:4px solid var(--line);background:var(--panel);margin:0 auto;display:grid;place-items:center}
.shutter i{width:42px;height:42px;border-radius:50%;background:var(--accent-solid);display:block}
.shutter[aria-disabled="true"]{opacity:.35}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:0 0 auto}
.thumbs.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;overflow:visible}
.thumb{flex:0 0 58px;height:58px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;font-size:10px;color:var(--ink-3);text-align:center;line-height:1.25;font-family:var(--mono)}
.thumbs.grid .thumb{flex:auto;height:46px;font-size:9px;line-height:1.2;padding:2px}
.cam{flex:0 0 auto}
.thumb.done{border-color:var(--ok);background:var(--ok-wash);color:var(--ok)}
.thumb.now{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}
.media{border-radius:9px;background:linear-gradient(150deg,#243039,#131a21);aspect-ratio:16/10;display:grid;place-items:center;color:rgba(255,255,255,.45);font-family:var(--mono);font-size:12px;position:relative}
.media .play{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;font-size:15px}
.media .tc{position:absolute;bottom:9px;left:12px;font-size:10.5px;color:rgba(255,255,255,.65)}
.hint{font-size:11.5px;color:var(--ink-3);text-align:center;padding:2px 0}

/* ===== 로그인 · 인증 ===== */
.sso{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:14.5px;font-weight:600;color:var(--ink);width:100%}
.sso:hover{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}
.sso .ms{display:grid;grid-template-columns:1fr 1fr;gap:1.5px;width:17px;height:17px;flex:0 0 auto}
.sso .ms b{display:block;border-radius:1px}
.otp{display:flex;gap:7px;justify-content:center}
.otp i{flex:1;max-width:44px;aspect-ratio:3/4;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-family:var(--mono);font-size:21px;font-weight:600;font-style:normal;color:var(--ink);cursor:pointer}
.otp i.on{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}
.otp i.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.lgn{max-width:420px;margin:40px auto 0;display:flex;flex-direction:column;gap:14px}
.lgn .mark{text-align:center;margin-bottom:6px}

/* ===== 인터랙션 ===== */
.dd{cursor:pointer;user-select:none}
.ddlist div:not(.off){cursor:pointer}
.ddlist div:not(.off):hover{background:var(--panel-2)}
.ddlist div.off{cursor:not-allowed}
button[data-picked="true"]{background:var(--accent-solid)!important;color:#fff!important;border-color:var(--accent-solid)!important}
button.inert{cursor:default;opacity:.55}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:99;
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:500;
  box-shadow:var(--sh);opacity:0;transition:opacity .22s,transform .22s;max-width:min(78vw,520px);text-align:center;line-height:1.45}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--warn);color:#fff}

.wmk{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;
     z-index:9999;color:#1A1A22;opacity:.07}
</style>
</head>

<body>

<div class="app">
  <aside class="rail">
    <div class="brand">Remote Inspection</div>
    <div class="brand-t">외주 통합관리 — 업무 흐름 데모</div>
    <div class="brand-s">클릭하면 실제 화면처럼 이동합니다. 화면정의서의 화면 ID와 대응합니다.</div>
    <div class="brand-s" style="margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)"><b>업무 흐름 확인용 데모입니다.</b> 실제 운영 화면이 아니며 배색·글꼴·구성을 바꿨습니다. 화면에 보이는 값은 모두 예시입니다. 회사명 · 시스템명 · 조직명 · 업체명 · 고객사 · 브랜드 · 제품명 · 제품코드 · 바코드 · LOT · 이메일 · 주소 · 사업자번호를 실제와 무관하게 바꿨습니다. <b>기능과 업무 흐름만</b> 보시면 됩니다.</div>
    <div id="nav"></div>
  </aside>

  <div class="stage">
    <div class="topbar">
      <span class="crumb" id="cid">RIS-M-01</span>
      <span class="crumb-t" id="cname">화면</span>
      <span class="crumb-d" id="cdesc"></span>
    </div>
    <div class="canvas" id="canvas"></div>
  </div>
</div>

<script>
const S = {}; // screen registry

/* ---------- helpers ---------- */
const h = (s) => s;
const go = (id) => { render(id); };
const phone = (title, sub, body, foot, back) => `
  <div class="phone">
    <div class="status"><span>9:41</span><span>▮▮▮ ᯤ ▮</span></div>
    <div class="hdr">
      ${back ? `<button class="back" onclick="go('${back}')" aria-label="뒤로">‹</button>` : ''}
      <h3>${title}${sub ? `<span class="sub">${sub}</span>` : ''}</h3>
    </div>
    <div class="body">${body}</div>
    ${foot ? `<div class="foot">${foot}</div>` : ''}
  </div>`;
const desktop = (url, body, tabs) => `
  <div class="desktop">
    <div class="dbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="durl">${url}</span></div>
    ${tabs || ''}
    <div class="body">${body}</div>
  </div>`;

/* ================= 로그인 · 인증 ================= */
S['RIS-E-01'] = { name:'임직원 로그인 · SSO', dev:'PC', role:'임직원',
  desc:'사내 계정 하나로 들어옵니다. 열리는 화면은 부여된 권한이 정하고, 권한이 없어도 승인할 건이 있으면 승인 화면이 열립니다.',
  html: () => desktop('inspection.example.com', `
    <div class="lgn">
      <div class="mark">
        <div class="brand">Remote Inspection</div>
        <div class="t1" style="font-size:21px;margin-top:5px">외주 원격검사</div>
        <div class="t2">당사 외주 운영</div>
      </div>
      <button class="sso" onclick="go('RIS-Q-01')">
        <span class="ms"><b style="background:#F25022"></b><b style="background:#7FBA00"></b><b style="background:#00A4EF"></b><b style="background:#FFB900"></b></span>
        회사 계정으로 로그인
      </button>
      <div class="hint">사내 PC에서 이미 로그인되어 있으면 이 버튼만 누르면 바로 들어옵니다.</div>
      <div class="note"><b>비밀번호를 따로 만들지 않습니다</b> · 사내 계정을 그대로 씁니다. 입사 · 퇴사 · 부서이동이 사내 계정 정보를 따라가므로, 담당자가 바뀌어도 이 시스템에서 계정을 손볼 일이 없습니다.</div>

const VERDICTS = ['적합','부적합','보완 요청','판정보류'];

function toast(msg, kind){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 260); }, 2600);
}
function closeDrops(){ document.querySelectorAll('.ddlist').forEach(l => l.remove()); }

/* 드롭다운 — 누르면 목록이 열리고 고르면 값이 바뀝니다 */
function openDrop(dd){
  const already = dd.parentElement.querySelector('.ddlist');
  closeDrops();
  if (already) return;
  const cur  = dd.textContent.trim();
  const set  = dd.dataset.opts;
  const prog = !set && PROG_OPTS.some(o => o.v === cur);
  const opts = set ? OPT_SETS[set] : (prog ? PROG_OPTS : LOT_OPTS);
  if (!opts) return;

  const list = document.createElement('div');
  list.className = 'ddlist';
  list.innerHTML = opts.map(o => {
    const cls = o.off ? 'off' : (o.v === cur ? 'on' : '');
    return `<div class="${cls}" data-v="${o.v}">${o.t}</div>`;
  }).join('');
  if (getComputedStyle(dd.parentElement).position === 'static') dd.parentElement.style.position = 'relative';
  dd.parentElement.appendChild(list);

  list.querySelectorAll('div').forEach(row => {
    row.onclick = e => {
      e.stopPropagation();
      if (row.classList.contains('off')){
        const why = { tgt:'이미 명세서가 등록됐거나 승인 전인 건입니다',
                      slot:'이미 2건이 찬 시간대입니다 · 다른 시간을 골라 주세요',
                      dept:'이 소속에는 책임자급 계정이 없어 1차 승인자를 정할 수 없습니다 · 생산운영 담당에게 책임자급 등록을 요청해 주세요',
                      pmail:'이미 다른 업체에 연결된 이메일입니다 · 업체 하나에 계정 하나입니다',
                      form:'사용중지된 양식입니다 · 양식 관리에서 활성화하세요' }[set]
                 || (prog ? '이미 종료된 값입니다' : '원격검사를 완료한 LOT만 고를 수 있습니다');
        toast(why, 'warn');
        return;
      }
      const v = row.dataset.v;
      dd.textContent = v;
      closeDrops();
      if (set === 'tgt'){
        const no = v.split(' · ')[0], direct = v.includes('직납');
        const badge = document.querySelector('.card .pill.acc');
        if (badge) badge.textContent = direct ? '직납 · 고객사 직송' : '내부입고 · 당사 창고';
        toast(direct
          ? `${no} 직납 — 등록하면 물류 담당이 고객사별 명세서와 배차를 등록합니다`
          : `${no} 내부입고 — 등록 후 바로 거래명세표를 출력합니다`);
      }
      else if (set === 'cust')    toast(`고객사 ${v} 배정 — 이 고객사의 명세서가 생성됩니다`);
      else if (set === 'form')    toast(v === '당사 공통'
        ? '당사 공통 양식 적용 — 이 고객사는 양식이 미등록입니다'
        : `등록 양식 ${v} 적용`);
      else if (set === 'carrier') toast(`운송사 ${v} 선택`);
      else if (set === 'slot')    toast(`입고 시간대 ${v} 선택`);
      else if (prog && v !== '진행중') toast(`${v} — 이 LOT은 종료되어 다음 명세서 착인LOT 목록에서 빠집니다`, 'warn');
      else if (prog)             toast('진행중 — 다음 명세서에도 계속 나타납니다');
      else                       toast(`착인LOT ${v} 선택`);
    };
  });
}

/* 판정 버튼 — 실제 화면처럼 하나만 선택됩니다 */
function pickVerdict(btn){
  const box = btn.closest('.foot') || btn.parentElement;
  if (box) box.querySelectorAll('button').forEach(b => {
    if (VERDICTS.includes(b.textContent.trim())) b.removeAttribute('data-picked');
  });
  btn.setAttribute('data-picked','true');

/* 행 추가 · 삭제 */
function addRow(btn){
  const tr = btn.closest('tr');
  if (!tr || !tr.parentElement) return toast('시안에서는 동작하지 않습니다');
  const tbody = tr.parentElement;
  const model = [...tbody.children].find(r => r !== tr && r.children.length > 2);
  if (!model) return toast('복제할 행이 없습니다', 'warn');
  const copy = model.cloneNode(true);
  const first = copy.children[0];
  if (first && /^\d+$/.test(first.textContent.trim())) first.textContent = tbody.children.length;
  copy.querySelectorAll('[data-wired]').forEach(e => e.removeAttribute('data-wired'));
  tbody.insertBefore(copy, tr);
  wireUI();
  toast('행을 추가했습니다');
}
function delRow(btn){
  const tr = btn.closest('tr');
  if (!tr || !tr.parentElement) return;
  const rows = [...tr.parentElement.children].filter(r => r.children.length > 2);
  if (rows.length > 1){ tr.remove(); toast('행을 삭제했습니다'); }
  else toast('마지막 행은 삭제할 수 없습니다', 'warn');
}
function addThumb(btn){
  const scope = btn.closest('.body') || document;
  const wrap = scope.querySelector('.thumbs');
  if (!wrap) return;
  const t = document.createElement('div');
  t.className = 'thumb done';
  t.innerHTML = '불러옴<br>↑';
  wrap.appendChild(t);
  wireThumbs();
}

  if (label.startsWith('＋'))      return addRow;

/* 봉인 확인 체크박스 — 체크해야 제출 버튼이 열립니다 */
function wireCheck(){
  document.querySelectorAll('span[style*="border-radius:4px"][style*="inline-block"]').forEach(box => {
    const card = box.closest('.card');
    if (!card || card.dataset.wired) return;
    card.dataset.wired = '1';
    card.style.cursor = 'pointer';
    card.onclick = () => {
      const on = box.dataset.on === '1';
      box.dataset.on = on ? '0' : '1';
      box.textContent = on ? '' : '✓';
      box.style.cssText += on
        ? ';background:transparent;border-color:var(--line)'
        : ';background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;text-align:center;line-height:15px;font-size:12px';
      const submit = [...document.querySelectorAll('.foot button')].find(b => b.textContent.trim() === '제출');
      if (submit){
        if (on) submit.setAttribute('aria-disabled','true');
        else    submit.removeAttribute('aria-disabled');
      }
    };
  });
}

/* 탭 — 누르면 활성 탭이 옮겨갑니다 */
function wireTabs(){
  document.querySelectorAll('.tabs').forEach(tabs => {
    tabs.querySelectorAll('button').forEach(b => {
      if (b.dataset.wired || b.getAttribute('onclick')) return;
      b.dataset.wired = '1';
      b.onclick = () => {
        tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected','false'));
        b.setAttribute('aria-selected','true');
        toast(`${b.textContent.trim()} 탭 · 시안에 이 목록은 없습니다`);
      };
    });
  });
}

/* 썸네일 — 누르면 큰 화면이 바뀝니다 */
function wireThumbs(){
  document.querySelectorAll('.thumbs').forEach(wrap => {
    const scope = wrap.closest('.body');
    const tc = scope ? scope.querySelector('.media .tc') : null;
    wrap.querySelectorAll('.thumb').forEach(t => {
      if (t.dataset.wired) return;
      t.dataset.wired = '1';
      t.style.cursor = 'pointer';
      t.onclick = () => {
        wrap.querySelectorAll('.thumb').forEach(x => x.classList.remove('now'));
        t.classList.add('now');
        const name = t.textContent.replace(/[✓↑]/g,'').replace(/\s+/g,' ').trim();
        if (tc) tc.textContent = `${name} · 00:42`;
      };
    });
  });
}

/* 목록 행 선택 — □ 를 누르면 ✓ 로 바뀝니다 (발주 품목 선택) */
function wireRowPick(){
  document.querySelectorAll('td').forEach(td => {
    const v = td.textContent.trim();
    if (v !== '□' && v !== '✓') return;
    const tr = td.closest('tr');
    if (!tr || tr.dataset.wired) return;
    tr.dataset.wired = '1';
    tr.style.cursor = 'pointer';
    tr.onclick = e => {
      if (e.target.closest('button') || e.target.closest('.dd')) return;
      if (parseFloat(getComputedStyle(tr).opacity) < 0.6)
        return toast('생산종료된 발주는 선택할 수 없습니다', 'warn');
      const on = td.textContent.trim() === '✓';
      td.textContent = on ? '□' : '✓';
      td.style.cssText = on ? 'color:var(--ink-3)' : 'color:var(--accent-ink);font-weight:700';
      tr.style.background = on ? '' : 'var(--accent-wash)';
    };
  });
}

/* 인증코드 — 빈 칸을 누르면 한 자리씩 채워지고, 6자리가 되면 확인이 열립니다 */
function wireOtp(){
  document.querySelectorAll('.otp[data-otp]').forEach(grp => {
    if (grp.dataset.wired) return;
    grp.dataset.wired = '1';
    const boxes = [...grp.querySelectorAll('i')];
    const seed = '417928';
    const sync = () => {
      const n = boxes.filter(b => b.textContent.trim()).length;
      boxes.forEach((b,i) => {
        b.classList.toggle('on', !!b.textContent.trim());
        b.classList.toggle('cur', i === n);
      });
      const ok = [...document.querySelectorAll('.foot button')].find(b => b.textContent.trim() === '확인');
      if (!ok) return;
      if (n === boxes.length) ok.removeAttribute('aria-disabled');
      else                    ok.setAttribute('aria-disabled','true');
    };
    grp.onclick = () => {
      const next = boxes.find(b => !b.textContent.trim());
      if (next) next.textContent = seed[boxes.indexOf(next)];
      else      boxes.forEach(b => b.textContent = '');   // 다시 누르면 비웁니다
      sync();
    };
    sync();
  });
}

function wireUI(){
  document.querySelectorAll('.dd').forEach(dd => {
    if (dd.dataset.wired) return;
    dd.dataset.wired = '1';
    dd.onclick = e => { e.stopPropagation(); openDrop(dd); };
  });
  document.querySelectorAll('button').forEach(b => {
    if (b.dataset.wired || b.getAttribute('onclick') || b.closest('.tabs')) return;
    b.dataset.wired = '1';
    const fn = actFor(b.textContent.trim());
    if (fn) b.onclick = () => {
      if (b.disabled || b.getAttribute('aria-disabled') === 'true'){
        if (b.dataset.why) toast(b.dataset.why, 'warn');   // 왜 잠겼는지 알려줍니다
        return;
      }
      fn(b);
    };
    else { b.classList.add('inert'); b.title = '시안에서는 동작하지 않습니다'; }
  });
  wireCheck(); wireTabs(); wireThumbs(); wireRowPick(); wireOtp();
}
document.addEventListener('click', () => closeDrops());
